[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-bot"
version = "0.1.0"
description = "Python project for Hyperliquid DEX SDK integration and fee calculation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "hyperliquid-python-sdk>=0.6.0",
    "eth-account>=0.8.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
